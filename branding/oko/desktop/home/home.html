<!-- OKO — домашня сторінка Element Web/Desktop (embedded_pages.home_url).
     Element вставляє цей HTML у свою сторінку й очищує його: <style>, <script>, <svg> видаляються,
     зберігаються <img> і атрибути style. Тому лише інлайн-стилі з токенами Compound (колір підлаштовується
     під світлу/темну тему) і картинка зі шляхом від кореня Element Web.
     ТЕКСТ ПРАВИЛ — ЧЕРНЕТКА, погодити з власником. Адресу ОКО (href) вписати, коли власник її дасть. -->
<div style="max-width:560px;margin:72px auto 0;padding:0 24px;text-align:center;font-family:inherit;color:var(--cpd-color-text-primary)">
  <img src="themes/oko/home/oko_znak.svg" width="96" height="96" alt="OKO" style="display:block;margin:0 auto 20px">
  <h1 style="font-size:28px;line-height:34px;font-weight:600;margin:0 0 8px">Вітаємо в OKO</h1>
  <p style="font-size:15px;line-height:22px;margin:0 0 28px;color:var(--cpd-color-text-secondary)">Робочий чат команди ОКО</p>
  <div style="text-align:left;background:var(--cpd-color-bg-subtle-secondary);border-radius:12px;padding:16px 20px;font-size:15px;line-height:22px">
    <p style="margin:0 0 10px">1. Робочі питання — у кімнатах свого простору (ліва панель).</p>
    <p style="margin:0 0 10px">2. Нові тендери й доручення надсилає бот OKO — відповідайте в тій самій кімнаті.</p>
    <p style="margin:0">3. Документи клієнтів не пересилайте в інші месенджери.</p>
  </div>
  <p style="margin:28px 0 0"><a href="https://oko.example/" style="color:var(--cpd-color-text-action-accent);font-weight:600;text-decoration:none">Відкрити програму ОКО →</a></p>
</div>
