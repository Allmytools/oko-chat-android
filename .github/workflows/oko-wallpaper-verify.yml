name: oko-wallpaper-verify

on:
  push:
    branches: [ai/oko-desktop]
    paths:
      - '.github/workflows/oko-wallpaper-verify.yml'
      - 'branding/oko/wallpaper_khaos/**'
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Ubuntu rasterizer and generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y librsvg2-bin fonts-liberation-sans-narrow
          python -m pip install --only-binary=:all: 'Pillow==12.3.0' 'numpy==2.5.3'
      - name: Verify SHA-256, regenerate SVG and compare PNG
        run: python branding/oko/wallpaper_khaos/verify.py "$RUNNER_TEMP/oko-wallpapers"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oko-verified-wallpapers
          path: ${{ runner.temp }}/oko-wallpapers/*.png
          if-no-files-found: error
          retention-days: 1
